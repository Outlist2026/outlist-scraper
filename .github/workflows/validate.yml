# Offline checks of the parsing code on saved HTML (no network, no secrets). Runs on every push and pull request.
name: Validate parsers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/scrapers/outlist_crawler.py --validate
        env:
          PYTHONUTF8: '1'
      - run: python scripts/scrapers/instagram_scraper.py --validate
        env:
          PYTHONUTF8: '1'
      - run: python -I scripts/scrapers/primary_sources/run.py --validate
        env:
          PYTHONUTF8: '1'
